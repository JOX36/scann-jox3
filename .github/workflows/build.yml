name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Solo en push (no en PRs abiertas): publica un release de GitHub con
      # el APK adjunto. De ahí es de donde la app lee la comprobación de
      # actualizaciones automáticas (ver UpdateManager.kt) — sin este paso
      # nunca hay nada que encontrar, aunque el código de auto-actualización
      # ya estuviera listo desde la Etapa 2.
      - name: Publicar release con el APK (solo en push)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          gh release create "v$VERSION" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Build automático v$VERSION" \
            --notes "Build automático desde el commit ${{ github.sha }} (rama ${{ github.ref_name }})." \
            --prerelease
